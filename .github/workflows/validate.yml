name: Validate Supper
on:
  push:
    branches: [main, supper-household-update]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
      - name: Domain and persistence regression tests
        run: swift test
      - name: Build iOS simulator app
        run: xcodebuild -project Supper.xcodeproj -scheme Supper -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Native navigation and editor UI regression tests
        run: xcodebuild -project Supper.xcodeproj -scheme Supper -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -derivedDataPath DerivedData -resultBundlePath UIResults CODE_SIGNING_ALLOWED=NO test
      - name: Export navigation screenshots
        if: always()
        run: |
          if [ -d UIResults.xcresult ]; then
            xcrun xcresulttool export attachments --path UIResults.xcresult --output-path UITestAttachments
            python3 - <<'PY'
          import base64, pathlib, subprocess
          for index, path in enumerate(sorted(pathlib.Path('UITestAttachments').glob('*.png'))[:8]):
              target = pathlib.Path('/tmp') / f'supper-ui-{index}.jpg'
              subprocess.run(['sips', '-Z', '700', '-s', 'format', 'jpeg', '-s', 'formatOptions', '50', str(path), '--out', str(target)], check=True, stdout=subprocess.DEVNULL)
              print('SUPPER_SCREENSHOT ' + str(index) + ' ' + base64.b64encode(target.read_bytes()).decode())
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: UIResults.xcresult
