name: Validate Supper
on:
  push:
    branches: [main, supper-household-update]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
      - name: Domain and persistence regression tests
        run: swift test
      - name: Build iOS simulator app
        # Keychain tests need a signed simulator app with an application identity.
        # Ad-hoc signing needs no Apple credentials; shipping entitlements are unchanged.
        run: xcodebuild -project Supper.xcodeproj -scheme Supper -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS=Tests/UI/Simulator.entitlements build
      - name: API key Keychain UI regression test
        run: xcodebuild -project Supper.xcodeproj -scheme Supper -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -derivedDataPath DerivedData -resultBundlePath AIResults -only-testing:SupperUITests/SupperUITests/testOpenAIKeyCanBeSavedReplacedAndRemovedWithoutSendingRequests CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS=Tests/UI/Simulator.entitlements test
      - name: Native navigation and editor UI regression tests
        timeout-minutes: 15
        run: xcodebuild -project Supper.xcodeproj -scheme Supper -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -derivedDataPath DerivedData -resultBundlePath UIResults -skip-testing:SupperUITests/SupperUITests/testOpenAIKeyCanBeSavedReplacedAndRemovedWithoutSendingRequests -skip-testing:SupperUITests/SupperUITests/testRecipeChatKeepsInputWhenReopenedAndCancelDoesNotSave -skip-testing:SupperUITests/SupperUITests/testRecipeChatStaysOpenAcrossEditorsAndProtectsManualChanges -skip-testing:SupperUITests/SupperUITests/testRecipeChatPreviewShowsRemovalsAndAppliesAndUndoesInPlace CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS=Tests/UI/Simulator.entitlements test
      - name: Export navigation screenshots
        if: always()
        run: |
          if [ -d UIResults.xcresult ]; then
            xcrun xcresulttool export attachments --path UIResults.xcresult --output-path UITestAttachments
            python3 - <<'PY'
          import base64, pathlib, subprocess
          for index, path in enumerate(sorted(pathlib.Path('UITestAttachments').glob('*.png'))[:12]):
              target = pathlib.Path('/tmp') / f'supper-ui-{index}.jpg'
              subprocess.run(['sips', '-Z', '700', '-s', 'format', 'jpeg', '-s', 'formatOptions', '50', str(path), '--out', str(target)], check=True, stdout=subprocess.DEVNULL)
              print('SUPPER_SCREENSHOT ' + str(index) + ' ' + base64.b64encode(target.read_bytes()).decode())
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: |
            AIResults.xcresult
            UIResults.xcresult
  recipe-chat:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
      - name: Recipe chat and preview UI tests
        timeout-minutes: 15
        run: xcodebuild -project Supper.xcodeproj -scheme Supper -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -derivedDataPath DerivedData -resultBundlePath ChatResults -only-testing:SupperUITests/SupperUITests/testRecipeChatKeepsInputWhenReopenedAndCancelDoesNotSave -only-testing:SupperUITests/SupperUITests/testRecipeChatStaysOpenAcrossEditorsAndProtectsManualChanges -only-testing:SupperUITests/SupperUITests/testRecipeChatPreviewShowsRemovalsAndAppliesAndUndoesInPlace CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS=Tests/UI/Simulator.entitlements test
      - name: Export recipe chat screenshots
        if: always()
        run: |
          if [ -d ChatResults.xcresult ]; then
            xcrun xcresulttool export attachments --path ChatResults.xcresult --output-path ChatAttachments
            python3 - <<'PY'
          import base64, pathlib, subprocess
          for index, path in enumerate(sorted(pathlib.Path('ChatAttachments').glob('*.png'))[:20]):
              target = pathlib.Path('/tmp') / f'supper-chat-{index}.jpg'
              subprocess.run(['sips', '-Z', '900', '-s', 'format', 'jpeg', '-s', 'formatOptions', '65', str(path), '--out', str(target)], check=True, stdout=subprocess.DEVNULL)
              print('SUPPER_SCREENSHOT ' + str(index) + ' ' + base64.b64encode(target.read_bytes()).decode())
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recipe-chat-test-results
          path: ChatResults.xcresult
