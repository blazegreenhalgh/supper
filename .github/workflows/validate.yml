name: Validate Supper
on:
  push:
    branches: [main, supper-household-update]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        suite: [editor, library]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
      - name: Domain and persistence regression tests
        if: matrix.suite == 'library'
        run: swift test
      - name: Build iOS simulator app
        # Keychain tests need a signed simulator app with an application identity.
        # Ad-hoc signing needs no Apple credentials; shipping entitlements are unchanged.
        run: xcodebuild -project Supper.xcodeproj -scheme Supper -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS=Tests/UI/Simulator.entitlements build
      - name: Photo comparison UI regression test
        if: matrix.suite == 'editor'
        run: xcodebuild -project Supper.xcodeproj -scheme Supper -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -parallel-testing-enabled NO -derivedDataPath DerivedData -resultBundlePath PhotoResults -only-testing:SupperUITests/SupperUITests/testRecipePhotosPreviewOriginalAndApplyWithUndoAndUploadOption CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS=Tests/UI/Simulator.entitlements test
      - name: Changed screens UI regression tests
        if: matrix.suite == 'editor'
        run: xcodebuild -project Supper.xcodeproj -scheme Supper -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -parallel-testing-enabled NO -derivedDataPath DerivedData -resultBundlePath SectionResults -only-testing:SupperUITests/SupperUITests/testIngredientAndSectionDragsPersistOnSave -only-testing:SupperUITests/SupperUITests/testRecipeCardPreviewActionsAndCollectionSubmenu -only-testing:SupperUITests/SupperUITests/testMainTagsCreateRenameDeleteAndIndividualEntry -only-testing:SupperUITests/SupperUITests/testGroceriesCanClearCheckedAndUncheckedItems -only-testing:SupperUITests/SupperUITests/testFormattingReviewCancelAndDraftOnlyApply -only-testing:SupperUITests/SupperUITests/testTagsSheetAndSimpleGrocerySelection -only-testing:SupperUITests/SupperUITests/testHomepageActionsAndActiveFilters CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS=Tests/UI/Simulator.entitlements test
      - name: API key Keychain UI regression test
        if: matrix.suite == 'library'
        run: xcodebuild -project Supper.xcodeproj -scheme Supper -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -parallel-testing-enabled NO -derivedDataPath DerivedData -resultBundlePath AIResults -only-testing:SupperUITests/SupperUITests/testOpenAIKeyCanBeSavedReplacedAndRemovedWithoutSendingRequests CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS=Tests/UI/Simulator.entitlements test
      - name: Native navigation and editor UI regression tests
        # Partition the existing suite so keyboard/drag failures and their screenshots
        # are available without waiting for the unrelated library/Keychain checks.
        run: |
          editor_tests=(
            testChatCollectionChangesApplyToDraftAndOnlyPersistOnSave
            testRecipeChatKeepsInputWhenReopenedAndCancelDoesNotSave
            testRecipeChatPreviewShowsRemovalsAndAppliesAndUndoesInPlace
            testRecipeChatRetainsSessionAcrossEditorsAndProtectsManualChanges
            testRecipeDragMovesBetweenHomeCollections
          )
          selection=(-skip-testing:SupperUITests/SupperUITests/testOpenAIKeyCanBeSavedReplacedAndRemovedWithoutSendingRequests -skip-testing:SupperUITests/SupperUITests/testMainTagsCreateRenameDeleteAndIndividualEntry -skip-testing:SupperUITests/SupperUITests/testGroceriesCanClearCheckedAndUncheckedItems -skip-testing:SupperUITests/SupperUITests/testFormattingReviewCancelAndDraftOnlyApply -skip-testing:SupperUITests/SupperUITests/testTagsSheetAndSimpleGrocerySelection -skip-testing:SupperUITests/SupperUITests/testHomepageActionsAndActiveFilters -skip-testing:SupperUITests/SupperUITests/testIngredientAndSectionDragsPersistOnSave -skip-testing:SupperUITests/SupperUITests/testRecipeCardPreviewActionsAndCollectionSubmenu)
          selection+=(-skip-testing:SupperUITests/SupperUITests/testRecipePhotosPreviewOriginalAndApplyWithUndoAndUploadOption)
          for test_name in "${editor_tests[@]}"; do
            if [ '${{ matrix.suite }}' = editor ]; then
              selection+=("-only-testing:SupperUITests/SupperUITests/$test_name")
            else
              selection+=("-skip-testing:SupperUITests/SupperUITests/$test_name")
            fi
          done
          xcodebuild -project Supper.xcodeproj -scheme Supper -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -parallel-testing-enabled NO -derivedDataPath DerivedData -resultBundlePath UIResults "${selection[@]}" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS=Tests/UI/Simulator.entitlements test
      - name: Export navigation screenshots
        if: always()
        run: |
          for result in PhotoResults UIResults SectionResults; do
            if [ -d "$result.xcresult" ]; then
              xcrun xcresulttool export attachments --path "$result.xcresult" --output-path "UITestAttachments/$result"
            fi
          done
          python3 - <<'PY'
          import base64, pathlib, subprocess
          for index, path in enumerate(sorted(pathlib.Path('UITestAttachments').rglob('*.png'))[:36]):
              target = pathlib.Path('/tmp') / f'supper-ui-{index}.jpg'
              subprocess.run(['sips', '-Z', '700', '-s', 'format', 'jpeg', '-s', 'formatOptions', '50', str(path), '--out', str(target)], check=True, stdout=subprocess.DEVNULL)
              print('SUPPER_SCREENSHOT ' + str(index) + ' ' + base64.b64encode(target.read_bytes()).decode())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results-${{ matrix.suite }}
          path: |
            PhotoResults.xcresult
            SectionResults.xcresult
            UITestAttachments
            AIResults.xcresult
            UIResults.xcresult
